<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pamir Shop</title><style>:root{font-family:system-ui,Arial;background:#f5f7f8;color:#18312c}body{margin:0}header{background:#146b54;color:white;padding:18px}main{max-width:900px;margin:auto;padding:16px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}button,select,input{font:inherit;padding:10px;border:1px solid #cdd8d4;border-radius:9px}button{cursor:pointer;background:white}button.primary{background:#146b54;color:white;border:0}.tabs button.active{background:#146b54;color:white}.card{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 5px #0001}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:110px}label{display:block;margin:10px 0 4px;font-weight:600}input,select{box-sizing:border-box;width:100%}table{width:100%;border-collapse:collapse}td,th{padding:10px 5px;text-align:left;border-bottom:1px solid #eee}small{color:#667}h1{margin:0}h2{font-size:20px}.hidden{display:none}.pill{background:#e3f2ec;padding:4px 9px;border-radius:12px}.danger{color:#b33}</style></head><body><header><div class="row" style="max-width:900px;margin:auto"><div><h1>🏔️ Pamir Shop</h1><span id="subtitle">Family supply tracker</span></div><select id="language" style="max-width:145px"><option value="en">English</option><option value="ru">Русский</option><option value="tg">Тоҷикӣ</option></select></div></header><main><div class="tabs" id="tabs"></div><section id="content"></section><small id="notice"></small></main><script>
const KEY='pamir_shop_v1';const seed={products:[{id:1,name:'Flour / Мука',unit:'bags',stock:8,min:5},{id:2,name:'Sugar / Сахар',unit:'kg',stock:12,min:20},{id:3,name:'Cooking oil / Масло',unit:'bottles',stock:6,min:10}],requests:[],shipments:[]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed}catch{db=seed}let lang='en',tab='home';const words={en:['Dashboard','Products','Requests','Purchases & delivery','Stock','Low stock','Pending requests','Total purchases','Add product','Product name','Unit','Quantity in stock','Minimum stock','Save','New request','Product','Quantity needed','Requested by','Send request','Requested','Purchased','Sent','Received','Buy / record','Purchase quantity','Price per unit (TJS)','Transport cost (TJS)','Record purchase','Mark sent','Confirm received','History','No records yet','Delete','Date','Total','Status','All changes are saved on this device only. For shared real-time access, a backend is required.','Family supply tracker','Purchase','Edit stock','Update','Notes'],ru:['Главная','Товары','Заявки','Закупки и доставка','Остатки','Мало товара','Заявки в ожидании','Сумма закупок','Добавить товар','Название товара','Единица','Остаток','Минимальный остаток','Сохранить','Новая заявка','Товар','Нужно количество','Кто запросил','Отправить заявку','Запрошено','Куплено','Отправлено','Получено','Купить / записать','Куплено количество','Цена за единицу (сомони)','Транспорт (сомони)','Записать покупку','Отметить отправку','Подтвердить получение','История','Пока нет записей','Удалить','Дата','Итого','Статус','Данные хранятся только на этом устройстве. Для общего доступа нужен сервер.','Учёт семейного магазина','Закупка','Изменить остаток','Обновить','Примечания'],tg:['Асосӣ','Молҳо','Дархостҳо','Харид ва интиқол','Бақия','Моли кам','Дархостҳои интизор','Ҷамъи харид','Иловаи мол','Номи мол','Воҳид','Миқдор дар мағоза','Ҳадди ақал','Сабт','Дархости нав','Мол','Миқдори лозим','Дархосткунанда','Фиристодани дархост','Дархост шуд','Харида шуд','Фиристода шуд','Қабул шуд','Сабти харид','Миқдори харидашуда','Нархи як воҳид (сомонӣ)','Роҳкиро (сомонӣ)','Сабти харид','Фиристода шуд','Қабулро тасдиқ кунед','Таърих','Ҳоло сабт нест','Нест кардан','Сана','Ҳамагӣ','Ҳолат','Маълумот танҳо дар ҳамин дастгоҳ нигоҳ дошта мешавад. Барои истифодаи муштарак сервер лозим аст.','Ҳисоби мағозаи оилавӣ','Харид','Тағйири бақия','Навсозӣ','Эзоҳ']};const t=i=>words[lang][i],money=n=>(+n||0).toFixed(2)+' TJS',product=id=>db.products.find(p=>p.id===+id),save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()},date=()=>new Date().toLocaleDateString('en-CA');function field(label,id,type='text',extra=''){return `<label>${label}</label><input id="${id}" type="${type}" ${extra} required>`}function options(){return db.products.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.unit})</option>`).join('')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function status(s){return ({requested:t(20),purchased:t(21),sent:t(22),received:t(23)})[s]}function render(){document.getElementById('subtitle').textContent=t(35);document.getElementById('notice').textContent=t(34);document.getElementById('tabs').innerHTML=[0,1,2,3].map((n,i)=>`<button class="${tab===['home','products','requests','delivery'][i]?'active':''}" onclick="tab='${['home','products','requests','delivery'][i]}';render()">${t(n)}</button>`).join('');let html='';if(tab==='home'){let low=db.products.filter(p=>p.stock<=p.min).length,pending=db.requests.filter(r=>r.status!=='received').length,total=db.requests.reduce((a,r)=>a+(r.qtyBought||0)*(r.price||0)+(r.transport||0),0);html=`<div class="row"><div class="card"><small>${t(4)}</small><h2>${db.products.length}</h2></div><div class="card"><small>${t(5)}</small><h2>${low}</h2></div><div class="card"><small>${t(6)}</small><h2>${pending}</h2></div><div class="card"><small>${t(7)}</small><h2>${money(total)}</h2></div></div><div class="card"><h2>${t(5)}</h2>${db.products.filter(p=>p.stock<=p.min).map(p=>`<p>${esc(p.name)}: <b class="danger">${p.stock} ${esc(p.unit)}</b></p>`).join('')||'—'}</div>`}if(tab==='products'){html=`<div class="card"><h2>${t(8)}</h2><form onsubmit="addProduct(event)">${field(t(9),'pname')}${field(t(10),'unit')}${field(t(11),'stock','number','min="0" step="any"')}${field(t(12),'min','number','min="0" step="any"')}<p><button class="primary">${t(13)}</button></p></form></div><div class="card"><h2>${t(4)}</h2><table>${db.products.map(p=>`<tr><td>${esc(p.name)}<br><small>${esc(p.unit)}</small></td><td>${p.stock} <small>(min ${p.min})</small></td><td><button onclick="adjust(${p.id})">${t(38)}</button></td></tr>`).join('')}</table></div>`}if(tab==='requests'){html=`<div class="card"><h2>${t(14)}</h2><form onsubmit="addRequest(event)"><label>${t(15)}</label><select id="product">${options()}</select>${field(t(16),'qty','number','min="0.001" step="any"')}<label>${t(17)}</label><select id="whoChoice" onchange="document.getElementById('whoOther').classList.toggle('hidden',this.value!=='other')"><option value="father">${({en:'Father',ru:'Отец',tg:'Падар'})[lang]}</option><option value="brother">${({en:'Brother',ru:'Брат',tg:'Бародар'})[lang]}</option><option value="other">${({en:'Other',ru:'Другой',tg:'Дигар'})[lang]}</option></select><div id="whoOther" class="hidden">${field(t(17),'who')}</div><p><button class="primary">${t(18)}</button></p></form></div>`+requestList()}if(tab==='delivery'){html=requestList(true)}document.getElementById('content').innerHTML=html}function requestList(delivery=false){let arr=[...db.requests].reverse();return `<div class="card"><h2>${delivery?t(3):t(30)}</h2>${arr.map(r=>{let p=product(r.productId);return `<div class="card"><b>${esc(p?.name||'Product')}</b> <span class="pill">${status(r.status)}</span><p>${t(16)}: ${r.qty} ${esc(p?.unit||'')} · ${t(17)}: <b>${esc(r.who)}</b> · ${esc(r.createdAt ? new Date(r.createdAt).toLocaleString(lang==='tg'?'tg-TJ':lang==='ru'?'ru-RU':'en-GB') : r.date)}</p>${r.qtyBought?`<p>${t(25)}: ${r.qtyBought} · ${t(26)}: ${money(r.price)} · ${t(33)}: ${money(r.qtyBought*r.price+r.transport)}</p>`:''}${r.status==='requested'?`<button class="primary" onclick="buy(${r.id})">${t(24)}</button>`:''}${r.status==='purchased'?`<button class="primary" onclick="setStatus(${r.id},'sent')">${t(29)}</button>`:''}${r.status==='sent'?`<button class="primary" onclick="setStatus(${r.id},'received')">${t(30)}</button>`:''}</div>`}).join('')||`<p>${t(31)}</p>`}</div>`}function addProduct(e){e.preventDefault();db.products.push({id:Date.now(),name:document.getElementById('pname').value.trim(),unit:document.getElementById('unit').value.trim(),stock:+document.getElementById('stock').value,min:+document.getElementById('min').value});save()}function addRequest(e){e.preventDefault();db.requests.push({id:Date.now(),productId:+document.getElementById('product').value,qty:+document.getElementById('qty').value,who:document.getElementById('whoChoice').value==='father'?({en:'Father',ru:'Отец',tg:'Падар'})[lang]:document.getElementById('whoChoice').value==='brother'?({en:'Brother',ru:'Брат',tg:'Бародар'})[lang]:document.getElementById('who').value.trim(),date:date(),createdAt:new Date().toISOString(),status:'requested'});save()}function buy(id){let r=db.requests.find(x=>x.id===id);let qty=prompt(t(25),r.qty);if(qty===null)return;let price=prompt(t(26),'0');if(price===null)return;let transport=prompt(t(27),'0');if(transport===null)return;[qty,price,transport]=[qty,price,transport].map(Number);if(!Number.isFinite(qty)||qty<=0||!Number.isFinite(price)||price<0||!Number.isFinite(transport)||transport<0){alert('Invalid number');return}Object.assign(r,{qtyBought:qty,price,transport,status:'purchased'});save()}function setStatus(id,s){let r=db.requests.find(x=>x.id===id);if(s==='received'&&r.status==='sent'){let p=product(r.productId);if(p)p.stock+=r.qtyBought}r.status=s;save()}function adjust(id){let p=product(id),n=prompt(t(11),p.stock);if(n===null)return;n=Number(n);if(!Number.isFinite(n)||n<0)return;p.stock=n;save()}document.getElementById('language').onchange=e=>{lang=e.target.value;render()};render();</script></body></html>
